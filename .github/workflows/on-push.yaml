name: on-push
run-name: On push to main

on:
  # run on commit to main branch
  push:
    branches:
      - main

  # run manually by user
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  # did this push touch the publication sources?
  changes:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.check.outputs.sources }}
    steps:
      - name: Checkout main branch contents
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changed citation sources
        id: check
        run: |
          # manual runs always refresh citations
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "sources=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "sources=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(_data/(sources|orcid|pubmed|google-scholar)|_cite/)'; then
            echo "sources=true" >> "$GITHUB_OUTPUT"
          else
            echo "sources=false" >> "$GITHUB_OUTPUT"
          fi

  # only fetch citations when sources changed (slow); weekly schedule also refreshes them
  update-citations:
    needs: changes
    if: needs.changes.outputs.sources == 'true'
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit

  # always build the site, even if citations were skipped or failed
  build-site:
    needs: update-citations
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-site.yaml
