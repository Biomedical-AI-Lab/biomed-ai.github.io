# site properties and page defaults
title: Biomedical AI Lab
description: We use machine learning to advance medicine, from wearable sensing and clinical gait analysis to language and imaging models for health.
proofer: false

# Show an "under construction" page instead of the site at the public address.
#   true  = visitors see the placeholder (use while we work on the site)
#   false = the full site is public
# Local previews and pull-request previews always show the full site.
under-construction: false

# The university name, logo, colors, fonts and address are NOT set here.
# They live in _data/affiliation.yaml so the branding can be swapped in one place.

# site social media and other links (shown in the footer)
links:
  email: Mark.Albert@unt.edu
  github: Biomedical-AI-Lab
  twitter: biomedai
  facebook: BiomedAI
  linkedin-company: biomedai

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts
  - .nojekyll

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
