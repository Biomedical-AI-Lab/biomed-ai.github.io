<!-- Google Fonts -->
<!-- families come from _data/affiliation.yaml (fonts.google) -->
{% assign brandfonts = site.data.affiliation.fonts.google %}
<link rel="preconnect" href="https://fonts.gstatic.com">
{% if brandfonts %}
  <link href="https://fonts.googleapis.com/css2?{{ brandfonts }}&display=swap" rel="stylesheet">
{% else %}
  {% assign googlefonts = "_styles/-theme.scss" | file_read | google_fonts %}
  <link href="{{ googlefonts }}" rel="stylesheet">
{% endif %}

<!-- Font Awesome icons (load asynchronously due to size) -->
{% assign fontawesome = "https://use.fontawesome.com/releases/v6.7.0/css/all.css" %}
<link
  href="{{ fontawesome }}"
  rel="stylesheet"
  media="none"
  onload="this.removeAttribute('media'); this.onload = null;"
/>
<noscript>
  <link href="{{ fontawesome }}" rel="stylesheet">
</noscript>
